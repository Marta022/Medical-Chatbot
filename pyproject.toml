[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | qdrant_storage
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "qdrant_storage",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = [
  "agent",
  "config",
  "knowledge",
  "models",
  "rag",
]
omit = [
  ".venv/*",
  "qdrant_storage/*",
  "tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
